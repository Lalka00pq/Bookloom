version: '3.8'

services:
  # Redis cache service
  redis:
    image: redis:7-alpine
    container_name: bookloom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - bookloom-network

  # ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: bookloom-ml-service
    ports:
      - "8080:8080"
    volumes:
      - ./ml-service/storage:/app/storage
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=gemini-1.5-flash
      - GEMINI_EMBEDDING_MODEL=models/embedding-001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - CHROMA_DB_PATH=/app/storage/chroma
      - DEBUG=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/ml/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - bookloom-network

volumes:
  redis_data:
    driver: local

networks:
  bookloom-network:
    driver: bridge
